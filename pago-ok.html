<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pago · Fotolibro</title>
<style>
:root{--bg:#eceef2;--card:#fff;--ink:#181b21;--muted:#5d6470;--accent:#b8155a}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c1f25;--ink:#eceef2;--muted:#9aa1ad;--accent:#ee5f9a}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:20px;box-sizing:border-box}
.c{background:var(--card);border-radius:16px;padding:28px;max-width:380px;text-align:center}
h1{margin:0 0 10px;font-size:24px}p{color:var(--muted);margin:0 0 18px;line-height:1.5}
button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <h1 id="t">¡Pago recibido!</h1>
  <p id="m">Volvé a la pestaña del Fotolibro: la descarga se habilita sola en unos segundos.</p>
  <button onclick="window.close();setTimeout(()=>location.href='/',300)">Volver al Fotolibro</button>
</div>
<script>
const q=new URLSearchParams(location.search);
if(q.has('e')){t.textContent='El pago no se completó';m.textContent='No se cobró nada. Volvé al Fotolibro y probá de nuevo.'}
else if(q.has('p')){t.textContent='Pago pendiente';m.textContent='Cuando Mercado Pago lo apruebe, la descarga se habilita sola en la pestaña del Fotolibro.'}
</script>
</body>
</html>
